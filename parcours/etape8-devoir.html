<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrançaisRoute — Être et avoir au présent</title><link rel="icon" href="../images/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="parcours.css"></head><body><noscript>Active JavaScript pour faire cette étape.</noscript><script>window.ETAPE={"titre": "Être et avoir au présent", "emoji": "🌈", "note": "Petit devoir de l’Activité, après les jeux de la classe de Lili. Il ajoute les mots qui se prononcent pareil : est / et, a / à, sont / son, ont / on.", "lecons": [{"texte": "être", "img": "😊", "titre": "Je retiens", "dire": "Je suis, tu es, il est, nous sommes, vous êtes, ils sont.", "tableau": [["je", "suis"], ["tu", "es"], ["il / elle", "est"], ["nous", "sommes"], ["vous", "êtes"], ["ils / elles", "sont"]]}, {"texte": "avoir", "img": "🎒", "titre": "Je retiens", "dire": "J’ai, tu as, il a, nous avons, vous avez, ils ont.", "tableau": [["j’", "ai"], ["tu", "as"], ["il / elle", "a"], ["nous", "avons"], ["vous", "avez"], ["ils / elles", "ont"]]}, {"texte": "il **est** · un chat **et** un chien", "img": "👂", "titre": "Ils se prononcent pareil", "sous": "Si je peux dire « **était** », j’écris **est**. Si je peux dire « **et puis** », j’écris **et**.", "dire": "Il est content. Un chat et un chien."}, {"texte": "il **a** · il va **à** l’école", "img": "👂", "titre": "Ils se prononcent pareil", "sous": "Si je peux dire « **avait** », j’écris **a** sans accent. Sinon, j’écris **à**.", "dire": "Il a un vélo. Il va à l’école."}], "exercices": [{"q": "Je ___ content.", "opts": ["suis", "ai", "es", "est"], "a": "suis", "img": "😊", "consigne": "Être ou avoir ?"}, {"q": "Tu ___ un vélo.", "opts": ["as", "es", "a", "ai"], "a": "as", "img": "🚲", "consigne": "Être ou avoir ?"}, {"q": "Nous ___ à l’école.", "opts": ["sommes", "avons", "sont", "êtes"], "a": "sommes", "img": "🏫", "consigne": "Être ou avoir ?"}, {"q": "Vous ___ des crayons.", "opts": ["avez", "êtes", "ont", "avons"], "a": "avez", "img": "✏️", "consigne": "Être ou avoir ?"}, {"q": "Ils ___ fatigués.", "opts": ["sont", "ont", "est", "son"], "a": "sont", "img": "😴", "consigne": "Être ou avoir ?"}, {"q": "Elle ___ faim.", "opts": ["a", "est", "à", "as"], "a": "a", "img": "🍽️", "consigne": "Être ou avoir ?", "aide": "On dit « elle avait faim » : c’est le verbe avoir, a sans accent."}, {"q": "Le chat ___ gris.", "opts": ["est", "et", "ai", "a"], "a": "est", "img": "🐈", "consigne": "est ou et ?", "aide": "On peut dire « le chat était gris » : on écrit est."}, {"q": "Un chat ___ un chien.", "opts": ["et", "est", "ai", "es"], "a": "et", "img": "🐈🐕", "consigne": "est ou et ?", "aide": "On peut dire « un chat et puis un chien » : on écrit et."}, {"q": "Il va ___ la piscine.", "opts": ["à", "a", "as", "ont"], "a": "à", "img": "🏊", "consigne": "a ou à ?", "aide": "On ne peut pas dire « il va avait la piscine » : on écrit à."}, {"q": "Mes amis ___ contents.", "opts": ["sont", "son", "ont", "est"], "a": "sont", "img": "👫", "consigne": "sont ou son ?", "aide": "On peut dire « mes amis étaient contents » : on écrit sont."}], "devoir": [{"q": "J’___ sept ans.", "opts": ["ai", "suis", "a", "as"], "a": "ai", "img": "🎂", "consigne": "Être ou avoir ?"}, {"q": "Tu ___ gentil.", "opts": ["es", "as", "est", "suis"], "a": "es", "img": "💛", "consigne": "Être ou avoir ?"}, {"q": "Elles ___ des fleurs.", "opts": ["ont", "sont", "on", "a"], "a": "ont", "img": "🌸", "consigne": "Être ou avoir ?"}, {"q": "Nous ___ froid.", "opts": ["avons", "sommes", "avez", "ont"], "a": "avons", "img": "🧣", "consigne": "Être ou avoir ?"}, {"q": "Le ciel ___ bleu.", "opts": ["est", "et", "es", "a"], "a": "est", "img": "🌤️", "consigne": "est ou et ?"}, {"q": "Léa ___ un ballon.", "opts": ["a", "à", "as", "est"], "a": "a", "img": "⚽", "consigne": "a ou à ?"}, {"q": "Sami joue avec ___ chien.", "opts": ["son", "sont", "ont", "on"], "a": "son", "img": "🐕", "consigne": "son ou sont ?", "aide": "On ne peut pas dire « avec étaient chien » : on écrit son."}, {"q": "Les enfants ___ des livres.", "opts": ["ont", "on", "sont", "a"], "a": "ont", "img": "📚", "consigne": "ont ou on ?", "aide": "On peut dire « les enfants avaient des livres » : on écrit ont."}], "n": 8, "fiche": "fiche8.html"};</script><script src="parcours.js"></script><script src="menu8.js"></script></body></html>

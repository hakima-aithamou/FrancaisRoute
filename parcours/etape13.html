<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrançaisRoute — Le passé composé</title><link rel="icon" href="../images/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="parcours.css"></head><body><noscript>Active JavaScript pour faire cette étape.</noscript><script>window.ETAPE={"titre": "Le passé composé", "emoji": "⏮️", "note": "Passé composé = avoir ou être au présent + participe passé (j’ai joué, je suis allé). Avec être, le participe s’accorde avec le sujet (elle est allée).", "lecons": [{"texte": "Hier, j’**ai** joué.", "img": "⚽", "titre": "C’est déjà fait", "sous": "Pour raconter ce qui est fini : **avoir** + le verbe en **-é** (pour les verbes en -er).", "dire": "Hier, j’ai joué. Avoir, plus le verbe en é."}, {"texte": "avoir + chanté", "img": "🎤", "titre": "Je conjugue", "dire": "J’ai chanté, tu as chanté, il a chanté, nous avons chanté, vous avez chanté, ils ont chanté.", "tableau": [["j’", "ai chanté"], ["tu", "as chanté"], ["il / elle", "a chanté"], ["nous", "avons chanté"], ["vous", "avez chanté"], ["ils / elles", "ont chanté"]]}, {"texte": "Je **suis** allé au parc.", "img": "🌳", "titre": "Avec être", "sous": "Avec **aller**, **partir**, **arriver**, **venir**, on utilise **être**.", "dire": "Je suis allé au parc. Avec aller, partir, arriver et venir, on utilise être."}, {"texte": "Elle est allé**e**.", "img": "👧", "titre": "L’accord avec être", "sous": "Avec être, on ajoute **-e** pour une fille et **-s** pour plusieurs.", "dire": "Elle est allée. Ils sont partis."}], "exercices": [{"q": "Hier, j’___ joué.", "opts": ["ai", "as", "a"], "a": "ai", "img": "⚽", "consigne": "Choisis la forme du verbe avoir."}, {"q": "Tu ___ chanté.", "opts": ["as", "ai", "ont"], "a": "as", "img": "🎤", "consigne": "Choisis la forme du verbe avoir."}, {"q": "Nous ___ mangé.", "opts": ["avons", "avez", "ont"], "a": "avons", "img": "🍝", "consigne": "Choisis la forme du verbe avoir."}, {"q": "Ils ___ regardé un film.", "opts": ["ont", "a", "avez"], "a": "ont", "img": "🎬", "consigne": "Choisis la forme du verbe avoir."}, {"q": "Elle ___ allée à l’école.", "opts": ["est", "a", "es"], "a": "est", "img": "🏫", "consigne": "Avoir ou être ?", "aide": "Avec aller, on utilise être."}, {"q": "Nous ___ partis tôt.", "opts": ["sommes", "avons", "sont"], "a": "sommes", "img": "🚌", "consigne": "Avoir ou être ?", "aide": "Avec partir, on utilise être."}, {"q": "J’ai ___ (jouer).", "opts": ["joué", "jouer", "joue"], "a": "joué", "img": "🎲", "consigne": "Choisis la bonne fin du verbe."}, {"q": "Vous avez ___ (danser).", "opts": ["dansé", "danser", "dansez"], "a": "dansé", "img": "💃", "consigne": "Choisis la bonne fin du verbe."}, {"q": "Il a ___ (finir) son dessin.", "opts": ["fini", "finir", "finit"], "a": "fini", "img": "🎨", "consigne": "Choisis la bonne fin du verbe.", "aide": "Pour les verbes comme finir : fini."}, {"q": "Elles sont ___ (arriver).", "opts": ["arrivées", "arrivé", "arriver"], "a": "arrivées", "img": "🚉", "consigne": "Choisis la bonne fin du verbe.", "aide": "Avec être, on accorde : elles → -es."}, {"q": "Quelle phrase est au **passé composé** ?", "opts": ["Nous avons parlé.", "Nous parlons.", "Nous allons parler."], "a": "Nous avons parlé.", "img": "💬"}], "devoir": [{"q": "J’___ dessiné un chat.", "opts": ["ai", "a", "as"], "a": "ai", "img": "🐈", "consigne": "Choisis la forme du verbe avoir."}, {"q": "Vous ___ travaillé.", "opts": ["avez", "avons", "a"], "a": "avez", "img": "✏️", "consigne": "Choisis la forme du verbe avoir."}, {"q": "Il ___ venu me voir.", "opts": ["est", "a", "sont"], "a": "est", "img": "👋", "consigne": "Avoir ou être ?"}, {"q": "Tu ___ arrivé en retard.", "opts": ["es", "as", "est"], "a": "es", "img": "⏰", "consigne": "Avoir ou être ?"}, {"q": "Nous avons ___ (gagner).", "opts": ["gagné", "gagner", "gagnons"], "a": "gagné", "img": "🏆", "consigne": "Choisis la bonne fin du verbe."}, {"q": "Tu as ___ (choisir).", "opts": ["choisi", "choisir", "choisis"], "a": "choisi", "img": "🍦", "consigne": "Choisis la bonne fin du verbe."}, {"q": "Elle est ___ (partir).", "opts": ["partie", "parti", "partir"], "a": "partie", "img": "🚗", "consigne": "Choisis la bonne fin du verbe."}, {"q": "Quelle phrase raconte ce qui est **fini** ?", "opts": ["J’ai lu ce livre.", "Je lis ce livre.", "Je vais lire ce livre."], "a": "J’ai lu ce livre.", "img": "📖"}], "n": 13, "fiche": "fiche13.html"};</script><script src="parcours.js"></script><script src="menu.js"></script></body></html>

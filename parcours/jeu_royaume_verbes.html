];
let index=0;const solved=new Set();const $=id=>document.getElementById(id);
function render(){
const q=questions[index],done=solved.has(index);
$('subject').textContent=q.subject;$('ending').textContent=q.end;
$('gap').textContent='?';$('gap').className='gap';
$('pedestal').innerHTML='<div class="empty-pedestal">🧱 Choisis un bloc !</div>';
$('feedback').textContent='✨ À toi de jouer !';
$('level').textContent=`Défi ${index+1} de ${questions.length}`;
$('progress').textContent=`Question ${index+1}/${questions.length}`;
$('stars').textContent=solved.size>=6?'⭐⭐⭐':solved.size>=4?'⭐⭐☆':solved.size>=2?'⭐☆☆':'☆☆☆';
$('back').disabled=index===0;$('next').disabled=!done;$('next').textContent=index===questions.length-1?'🔁 REJOUER':'SUIVANT ➡';
$('answers').replaceChildren();
q.opts.forEach((word,choiceIndex)=>{const b=document.createElement('button');b.className='answer';b.textContent=word;b.setAttribute('aria-label','Choisir '+word);b.onclick=()=>choose(word,choiceIndex);$('answers').append(b)});
}
function choose(word,choiceIndex){
const q=questions[index];
if(word!==q.good){$('feedback').textContent='💬 Essaie un autre bloc !';return}
solved.add(index);setTimeout(()=>LIRE(document.getElementById('subject').textContent+' '+document.getElementById('gap').textContent+' '+document.getElementById('ending').textContent),50);
const colorClass=['choice-purple','choice-yellow','choice-green','choice-blue'][choiceIndex];$('gap').textContent=word;$('gap').classList.add('filled',colorClass);
const block=document.createElement('div');block.className='selected '+colorClass;block.textContent=word;$('pedestal').replaceChildren(block);
$('feedback').textContent='⭐ Bravo ! Le bloc rejoint la tour !';
$('answers').querySelectorAll('button').forEach((b,i)=>{b.disabled=true;if(i===choiceIndex)b.classList.add('chosen')});
$('next').disabled=false;$('stars').textContent=solved.size>=6?'⭐⭐⭐':solved.size>=4?'⭐⭐☆':solved.size>=2?'⭐☆☆':'☆☆☆';
$('progress').textContent=`Question ${index+1}/${questions.length}`;
}
$('back').onclick=()=>{if(index>0){index--;render()}};
$('next').onclick=()=>{if(index===questions.length-1){index=0;solved.clear()}else{index++}render()};
render();

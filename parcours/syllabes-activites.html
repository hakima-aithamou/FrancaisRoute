<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FrançaisRoute — Le jardin des syllabes</title><link rel="icon" href="../images/favicon.svg" type="image/svg+xml"><style>
*{box-sizing:border-box}body{margin:0;font-family:'Trebuchet MS',Arial,sans-serif;background:linear-gradient(145deg,#bcecff,#f8eaff 55%,#d9ffd5);color:#26335e;min-height:100vh}button{font:inherit;cursor:pointer}button:focus-visible{outline:4px solid #5146a8;outline-offset:3px}.shell{max-width:1060px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.back{background:#fff;border:2px solid #b9a4ee;border-radius:18px;padding:10px 16px;text-decoration:none;color:#3a3474;font-weight:bold}.brand{font-weight:900;color:#583ea0}.hero{text-align:center;padding:12px 0}.hero h1{font-size:clamp(29px,5vw,49px);margin:6px}.hero p{font-size:clamp(16px,2.5vw,21px);margin:8px}.modes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px 0}.mode{border:3px solid white;background:#fff9;border-radius:20px;padding:12px 18px;font-size:18px;font-weight:bold;color:#3c3972;box-shadow:0 5px 12px #6753a523}.mode.active{background:#6d4bd2;color:white}.stage{background:#ffffffeb;border:4px solid white;border-radius:35px;box-shadow:0 12px 32px #6b69a42e;padding:22px;min-height:500px;position:relative;overflow:hidden}.stage:before{content:'✿  ✦  ✿';position:absolute;right:20px;top:12px;color:#d4b4f4;font-size:24px}.progress{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:bold;color:#6452a4;margin-bottom:15px}.track{height:12px;background:#e9e5ff;border-radius:20px;overflow:hidden;flex:1;max-width:360px}.fill{height:100%;width:0;background:linear-gradient(90deg,#63cdb3,#a884ff);transition:width .3s}.activity{display:grid;grid-template-columns:minmax(220px,1fr) minmax(260px,1.15fr);gap:25px;align-items:center}.picture{width:100%;max-height:330px;aspect-ratio:520/370;object-fit:contain;border-radius:26px;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 8px 10px #7774a522)}@keyframes float{50%{transform:translateY(-7px)}}.content{text-align:center}.content h2{font-size:clamp(22px,3.5vw,32px);margin:10px 0}.syllables{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:20px 0}.syll{background:#ffe8a8;border:3px solid #f6b950;border-radius:18px;padding:12px 18px;font-size:clamp(25px,4vw,38px);font-weight:900;color:#643f92;animation:pop .5s backwards}.syll:nth-child(2){animation-delay:.15s;background:#d4f5d5;border-color:#8ddaa1}.syll:nth-child(3){animation-delay:.3s;background:#e3ddff;border-color:#b8a4ed}@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}.desc{font-size:20px;line-height:1.5}.answers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:20px}.answer{padding:14px 8px;background:#ece5ff;border:3px solid #c2aff8;border-radius:20px;font-size:clamp(21px,3vw,30px);font-weight:900;color:#503d8b;min-height:75px}.answer.correct{background:#bdf3c9;border-color:#36b36b}.answer.wrong{background:#ffe1df;border-color:#f08883}.answer:disabled{cursor:default}.feedback{min-height:45px;font-size:20px;font-weight:bold;margin-top:12px}.controls{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}.btn{border:0;border-radius:22px;padding:13px 21px;font-weight:900;font-size:18px;background:#674bd0;color:white}.btn.secondary{background:#fff0c2;color:#57418a;border:2px solid #f0cf74}.btn:disabled{opacity:.45;cursor:not-allowed}.sound{background:#d7f6f5;color:#205e6c}.stars{font-size:25px;color:#ed9e2e}.footer{text-align:center;color:#5c5786;margin:14px}.celebrate{animation:pop .4s}.hint{font-size:15px;color:#716b91}.end{text-align:center;padding:35px 10px}.end h2{font-size:38px}.end .big{font-size:85px}@media(max-width:680px){.shell{padding:9px}.stage{padding:15px;border-radius:23px}.activity{grid-template-columns:1fr;gap:4px}.picture{max-height:220px}.answers{gap:6px}.answer{min-height:65px;padding:10px 3px}.controls{justify-content:center}.hero h1{font-size:29px}}

/* Décor de l'seules les propriétés visuelles sont ajoutées. */
body{background:#b8eaf8 url("fond-jardin-etape02.webp") center center / cover fixed no-repeat;position:relative;isolation:isolate}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(233,250,255,.05),rgba(255,248,238,.02) 50%,rgba(220,255,215,.06))}
.shell{position:relative;z-index:1}
.hero{background:rgba(255,255,255,.95);border:3px solid rgba(255,255,255,.9);border-radius:28px;box-shadow:0 8px 22px #496a8833;margin-top:14px;backdrop-filter:none}
.mode{transition:transform .2s,box-shadow .2s;box-shadow:0 5px 14px #4c648d33}

@media(max-width:680px){body{background-attachment:scroll}.hero{margin-top:10px}}

body{background-position:center top;background-size:cover}

</style></head><body><main class="shell"><div class="top"><a class="back" href="index.html">← Parcours</a><span class="brand">🌈 FrançaisRoute · 1AP</span><a class="back" href="index.html">🏠 Accueil</a></div><header class="hero"><h1>🌼 Le jardin des syllabes</h1><p>J'écoute, je regarde et je joue avec les syllabes !</p></header><nav class="modes" aria-label="Choisir une activité"><button class="mode active" data-mode="lecons">📖 Je découvre</button><button class="mode" data-mode="exercices">🎯 Je m'entraîne</button><button class="mode" data-mode="devoir">🏆 Mon défi</button></nav><section class="stage" aria-live="polite"><div class="progress"><span id="count">1 / 9</span><div class="track"><div class="fill" id="fill"></div></div><span class="stars" id="stars">⭐ 0</span></div><div id="activity"></div><div class="controls"><button class="btn secondary" id="prev">← Retour</button><button class="btn sound" id="speak">🔊 Écouter</button><button class="btn" id="next">Suivant →</button></div></section><p class="footer">✨ Apprends à ton rythme. Tu peux écouter plusieurs fois ! ✨</p></main><script>const DATA={"lecons": [{"texte": "m + a = ma", "img": "🏠", "titre": "Je lis une syllabe", "sous": "ma comme **ma**ison", "dire": "m, a : ma. ma comme maison.", "image": "images-etape2/maison.svg", "mot": "maison"}, {"texte": "ma · mi · mo · mu", "img": "🏍️", "titre": "Avec m", "sous": "mo comme **mo**to", "dire": "ma, mi, mo, mu. mo comme moto.", "image": "images-etape2/moto.svg", "mot": "moto"}, {"texte": "pa · pi · po · pu", "img": "🏴‍☠️", "titre": "Avec p", "sous": "pi comme **pi**rate", "dire": "pa, pi, po, pu. pi comme pirate.", "image": "images-etape2/pirate.svg", "mot": "pirate"}, {"texte": "la · li · lo · lu", "img": "🐰", "titre": "Avec l", "sous": "la comme **la**pin", "dire": "la, li, lo, lu. la comme lapin.", "image": "images-etape2/lapin.svg", "mot": "lapin"}, {"texte": "sa · si · so · su", "img": "🥗", "titre": "Avec s", "sous": "sa comme **sa**lade", "dire": "sa, si, so, su. sa comme salade.", "image": "images-etape2/salade.svg", "mot": "salade"}, {"texte": "ra · ri · ro · ru", "img": "🤖", "titre": "Avec r", "sous": "ro comme **ro**bot", "dire": "ra, ri, ro, ru. ro comme robot.", "image": "images-etape2/robot.svg", "mot": "robot"}, {"texte": "ta · ti · to · tu", "img": "🌷", "titre": "Avec t", "sous": "tu comme **tu**lipe", "dire": "ta, ti, to, tu. tu comme tulipe.", "image": "images-etape2/tulipe.svg", "mot": "tulipe"}, {"texte": "pa + pa = papa", "img": "👨", "titre": "Je forme un mot", "sous": "On colle les syllabes pour lire un mot.", "dire": "pa, pa : papa.", "image": "images-etape2/papa.svg", "mot": "papa"}, {"texte": "to · ma · te", "img": "🍅", "titre": "Je compte les syllabes", "sous": "to-ma-te : je tape 3 fois dans mes mains.", "dire": "to, ma, te. Tomate a trois syllabes.", "image": "images-etape2/tomate.svg", "mot": "tomate"}], "exercices": [{"q": "Quelle syllabe entends-tu au début ?", "opts": ["ma", "mi", "la"], "a": "ma", "img": "🏠", "dire": "Maison. Quelle syllabe entends-tu au début ?", "image": "images-etape2/maison.svg", "mot": "maison"}, {"q": "Quelle syllabe entends-tu au début ?", "opts": ["pi", "pa", "li"], "a": "pi", "img": "🏴‍☠️", "dire": "Pirate.", "image": "images-etape2/pirate.svg", "mot": "pirate"}, {"q": "Quelle syllabe entends-tu au début ?", "opts": ["lu", "la", "mu"], "a": "lu", "img": "🌙", "dire": "Lune.", "image": "images-etape2/lune.svg", "mot": "lune"}, {"q": "Quelle syllabe entends-tu au début ?", "opts": ["so", "sa", "to"], "a": "so", "img": "☀️", "dire": "Soleil.", "image": "images-etape2/soleil.svg", "mot": "soleil"}, {"q": "Quelle syllabe entends-tu au début ?", "opts": ["ro", "ri", "lo"], "a": "ro", "img": "🤖", "dire": "Robot.", "image": "images-etape2/robot.svg", "mot": "robot"}, {"q": "Quelle syllabe entends-tu au début ?", "opts": ["ti", "ta", "pi"], "a": "ti", "img": "🐯", "dire": "Tigre.", "image": "images-etape2/tigre.svg", "mot": "tigre"}, {"q": "Quelle syllabe entends-tu au début ?", "opts": ["mu", "ma", "mo"], "a": "mu", "img": "🎵", "dire": "Musique.", "image": "images-etape2/musique.svg", "mot": "musique"}, {"q": "Quelle syllabe entends-tu au début ?", "opts": ["li", "la", "lo"], "a": "li", "img": "📖", "dire": "Livre.", "image": "images-etape2/livre.svg", "mot": "livre"}, {"q": "Lis : **mo + to**. Quel mot formes-tu ?", "opts": ["moto", "tomo", "mito"], "a": "moto", "img": "🏍️", "image": "images-etape2/moto.svg", "mot": "moto"}, {"q": "Lis : **la + ma**. Quel mot formes-tu ?", "opts": ["lama", "mala", "lami"], "a": "lama", "img": "🦙", "image": "images-etape2/lama.svg", "mot": "lama"}, {"q": "Combien de syllabes dans **salade** ?", "opts": ["3", "2", "1"], "a": "3", "img": "🥗", "dire": "Sa, la, de. Combien de syllabes dans salade ?", "aide": "Tape dans tes mains : sa-la-de.", "image": "images-etape2/salade.svg", "mot": "salade"}, {"q": "Combien de syllabes dans **moto** ?", "opts": ["2", "3", "1"], "a": "2", "img": "🏍️", "dire": "Mo, to. Combien de syllabes dans moto ?", "image": "images-etape2/moto.svg", "mot": "moto"}], "devoir": [{"q": "Quelle syllabe entends-tu au début ?", "opts": ["sa", "si", "so"], "a": "sa", "img": "🌲", "dire": "Sapin. Quelle syllabe entends-tu au début ?", "image": "images-etape2/sapin.svg", "mot": "sapin"}, {"q": "Quelle syllabe entends-tu au début ?", "opts": ["ra", "ro", "la"], "a": "ra", "img": "🍇", "dire": "Raisin.", "image": "images-etape2/raisin.svg", "mot": "raisin"}, {"q": "Quelle syllabe entends-tu au début ?", "opts": ["po", "pa", "to"], "a": "po", "img": "🚪", "dire": "Porte.", "image": "images-etape2/porte.svg", "mot": "porte"}, {"q": "Quelle syllabe entends-tu au début ?", "opts": ["ru", "ra", "lu"], "a": "ru", "img": "🎀", "dire": "Ruban.", "image": "images-etape2/ruban.svg", "mot": "ruban"}, {"q": "Lis : **to + ma + te**. Quel mot formes-tu ?", "opts": ["tomate", "matote", "tamote"], "a": "tomate", "img": "🍅", "image": "images-etape2/tomate.svg", "mot": "tomate"}, {"q": "Lis : **pi + lo + te**. Quel mot formes-tu ?", "opts": ["pilote", "lopite", "pitole"], "a": "pilote", "img": "👨‍✈️", "image": "images-etape2/pilote.svg", "mot": "pilote"}, {"q": "Combien de syllabes dans **patate** ?", "opts": ["3", "2", "4"], "a": "3", "img": "🥔", "dire": "Pa, ta, te. Combien de syllabes dans patate ?", "image": "images-etape2/patate.svg", "mot": "patate"}, {"q": "Combien de syllabes dans **lit** ?", "opts": ["1", "2", "3"], "a": "1", "img": "🛏️", "dire": "Lit. Combien de syllabes dans lit ?", "image": "images-etape2/lit.svg", "mot": "lit"}]};
let mode=new URLSearchParams(location.search).get('mode')||'lecons',index=0,score=0,answered=false,finished=false;const $=s=>document.querySelector(s);const all=s=>document.querySelectorAll(s);function say(t){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/\*\*/g,''));u.lang='fr-FR';u.rate=.78;u.pitch=1.13;const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('fr'));if(v)u.voice=v;speechSynthesis.speak(u)}function syllables(text){let s=text.replace(/\*\*/g,'').trim();if(s.includes('+'))return s.split('=')[0].split('+').map(x=>x.trim());if(s.includes('·'))return s.split('·').map(x=>x.trim());return [s]}function escapeHtml(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function displayText(t){return escapeHtml(t).replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')}function current(){return DATA[mode][index]}function prompt(o){if(o.dire)return o.dire;return o.q?o.q.replace(/\*\*/g,''):o.texte+' '+(o.sous||'').replace(/\*\*/g,'')}function render(){const items=DATA[mode];$('#count').textContent=Math.min(index+1,items.length)+' / '+items.length;$('#fill').style.width=((index+1)/items.length*100)+'%';$('#stars').textContent='⭐ '+score;$('#prev').disabled=index===0&&!finished;$('#next').textContent=index===items.length-1?'Terminer ✓':'Suivant →';if(finished){$('#activity').innerHTML='<div class="end celebrate"><div class="big">🎉🌟🎈</div><h2>Bravo, petit champion !</h2><p class="desc">Tu as terminé cette activité !</p><p class="stars">⭐ '+score+' bonnes réponses</p><button class="btn" id="again">🔁 Rejouer</button></div>';$('#again').onclick=()=>{index=0;score=0;finished=false;answered=false;render()};$('#next').disabled=true;return}$('#next').disabled=mode!=='lecons'&&!answered;const o=current();const img='<img class="picture" src="'+o.image+'" alt="Illustration de '+escapeHtml(o.mot)+'">';let content='';if(mode==='lecons'){content='<h2>'+escapeHtml(o.titre)+'</h2><div class="syllables">'+syllables(o.texte).map(x=>'<span class="syll">'+escapeHtml(x)+'</span>').join('')+'</div><p class="desc">'+displayText(o.sous)+'</p><p class="hint">👂 Appuie sur Écouter pour entendre les syllabes.</p>'}else{content='<h2>'+displayText(o.q)+'</h2><div class="answers">'+o.opts.map((x,i)=>'<button class="answer" data-answer="'+i+'">'+escapeHtml(x)+'</button>').join('')+'</div><div class="feedback" id="feedback" aria-live="polite"></div>'}$('#activity').innerHTML='<div class="activity">'+img+'<div class="content">'+content+'</div></div>';all('.answer').forEach(b=>b.onclick=()=>choose(b));}function choose(b){if(answered)return;const o=current(),v=o.opts[Number(b.dataset.answer)];if(v===o.a){answered=true;score++;b.classList.add('correct');all('.answer').forEach(x=>x.disabled=true);$('#feedback').textContent='🌟 Bravo ! C’est la bonne réponse !';$('#next').disabled=false;say('Bravo ! '+o.a+'. Très bien !')}else{b.classList.add('wrong');b.disabled=true;$('#feedback').textContent='🌱 Essaie encore ! Écoute bien.';say('Essaie encore. '+(o.dire||o.mot))}$('#stars').textContent='⭐ '+score}all('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;index=0;score=0;answered=false;finished=false;all('.mode').forEach(x=>x.classList.toggle('active',x===b));speechSynthesis.cancel();render()});$('#prev').onclick=()=>{if(finished)finished=false;else if(index>0)index--;answered=mode==='lecons';render()};$('#next').onclick=()=>{if(index===DATA[mode].length-1){finished=true;say('Bravo ! Tu as terminé le jardin des syllabes !')}else{index++;answered=false}render()};$('#speak').onclick=()=>say(finished?'Bravo ! Tu as terminé !':prompt(current()));all('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));render();</script></body></html>

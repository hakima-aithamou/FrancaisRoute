<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Classe de Lili — 3 questions par pronom</title><style>*{box-sizing:border-box}body{font-family:system-ui,'Trebuchet MS',sans-serif;background:linear-gradient(125deg,#e8f9ff,#fff0d9);color:#352657;margin:0}.wrap{max-width:780px;margin:auto;padding:15px}.header{background:white;border-radius:20px;padding:12px 18px;display:flex;gap:14px;align-items:center;border:3px solid #d9baff}.lili{font-size:62px}.say{font-weight:850;font-size:clamp(19px,3.4vw,27px)}h1{text-align:center;font-size:clamp(24px,4vw,36px);margin:12px}.panel{margin-top:14px;background:#fff;border:5px solid #a5dfd0;border-radius:30px;min-height:370px;padding:24px;text-align:center;box-shadow:0 7px #d6e8df}.panel.avoir{border-color:#f2cc83}.mini{font-size:18px;font-weight:850;color:#6d5c88}.verb{font-size:clamp(24px,4vw,36px);font-weight:950;margin:12px}.rule{font-size:clamp(34px,6vw,53px);font-weight:950;color:#0a7a56;background:#e8fff0;border-radius:18px;padding:12px}.avoir .rule{color:#a25b12;background:#fff5df}.pic{font-size:95px;margin:10px}.example{font-size:clamp(23px,4vw,34px);font-weight:900}.question{font-size:clamp(28px,5vw,43px);font-weight:950;margin:18px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:520px;margin:22px auto}.options button{font-size:clamp(24px,4vw,35px);font-weight:950;border:3px solid #a78be1;border-radius:19px;background:#f2ecff;padding:20px;cursor:pointer}.options button:disabled{opacity:.75;cursor:default}.options button.correct{background:#c8f8d7;border-color:#36a568}.options button.wrong{background:#ffe0de;border-color:#d96764}.feedback{min-height:35px;font-size:24px;font-weight:850}.nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:20px}.nav button{background:#7954b6;color:white;font-size:18px;font-weight:900;padding:12px 17px;border:0;border-radius:13px;cursor:pointer}.nav button:disabled{opacity:.35}.counter{font-size:15px;font-weight:900;text-align:center}.recap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}.item{border-radius:14px;background:#f0f7ff;padding:14px;font-size:clamp(20px,3vw,28px);font-weight:900}.note{text-align:center;font-size:13px;color:#66577a;margin:16px}@media(max-width:480px){.wrap{padding:9px}.panel{padding:13px;min-height:355px}.lili{font-size:48px}.options button{padding:14px}.nav button{font-size:14px;padding:11px}.recap{gap:6px}.item{padding:10px}}.conj{background:#e8fff0;border:3px solid #a5dfd0;border-radius:18px;padding:10px 14px;margin:10px auto 4px;max-width:560px}.avoir .conj{background:#fff5df;border-color:#f2cc83}.conj-titre{font-size:17px;font-weight:900;color:#0a7a56;margin-bottom:6px}.avoir .conj-titre{color:#a25b12}.conj-grille{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 12px;font-size:clamp(17px,2.6vw,22px);text-align:left}.conj-grille b{color:#0a7a56}.avoir .conj-grille b{color:#a25b12}.question{margin:12px 0!important}@media(max-width:480px){.conj-grille{grid-template-columns:repeat(2,minmax(0,1fr))}}.ecoute{margin-left:auto;background:#7954b6;color:#fff;border:0;border-radius:12px;padding:10px 14px;font-size:17px;font-weight:900;cursor:pointer}.case{display:inline-flex;align-items:center;justify-content:center;min-width:3.2em;min-height:1.25em;padding:0 .3em;margin:0 .2em;border:3px dashed #b9a2e6;border-radius:12px;background:#f7f2ff;vertical-align:middle;line-height:1.1;transition:background .3s,border-color .3s}.case.pleine{border-style:solid;border-color:#36a568;background:#d8f3df;color:#0f5a2e}.glisse{background:#c8f8d7;border:3px solid #36a568;border-radius:14px;font-weight:900;color:#0f5a2e;font-size:clamp(22px,3.6vw,32px);box-shadow:0 8px 20px #0003}.haut-lili{display:flex;gap:10px;align-items:center;background:#7954b6;padding:10px 16px}.haut-lili[hidden]{display:none}.haut-lili .sp{flex:1}.haut-lili a{color:#fff;text-decoration:none;font-weight:900;font-size:18px;border:2px solid #ffffff66;border-radius:14px;padding:8px 14px;background:#ffffff1f}.haut-lili a.vert{background:#36a568;border-color:#36a568}.suite-lili{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}.suite-lili .gros{background:#36a568;color:#fff;text-decoration:none;font-weight:900;font-size:22px;border-radius:18px;padding:14px 22px}.suite-lili .gros.autre{background:#7954b6}.suite-lili .gros.tout{background:#e1efe6;color:#185740}</style></head><body><div class="haut-lili" id="hautLili" hidden><a href="etape8.html" id="retourLili">← Activité</a><span class="sp"></span><a href="etape8-etre.html" id="versQuestions" class="vert">❓ Les questions</a></div><div class="wrap"><h1 id="titreLili">🌈 La classe de Lili</h1><div class="header"><div class="lili">👩‍🏫</div><div class="say" id="say">Regarde et apprends !</div><button type="button" id="ecoute" class="ecoute">🔊 Écouter</button></div><div class="panel" id="panel"></div><div class="nav"><button id="back">⬅ Retour</button><div class="counter" id="counter"></div><button id="next">Suivant ➡</button></div></div><script>
const pronouns=[["être", "Je", "suis", "😄", "Je suis content."], ["être", "Tu", "es", "🎒", "Tu es prêt."], ["être", "Il", "est", "⚽", "Il est sportif."], ["être", "Elle", "est", "🌸", "Elle est heureuse."], ["être", "Nous", "sommes", "👫", "Nous sommes amis."], ["être", "Vous", "êtes", "🎉", "Vous êtes contents."], ["être", "Ils", "sont", "👦", "Ils sont joyeux."], ["être", "Elles", "sont", "👧", "Elles sont heureuses."], ["avoir", "J’", "ai", "📘", "J’ai un livre."], ["avoir", "Tu", "as", "🚲", "Tu as un vélo."], ["avoir", "Il", "a", "🐶", "Il a un chien."], ["avoir", "Elle", "a", "🌼", "Elle a une fleur."], ["avoir", "Nous", "avons", "✏️", "Nous avons des crayons."], ["avoir", "Vous", "avez", "🍎", "Vous avez des pommes."], ["avoir", "Ils", "ont", "🧸", "Ils ont des jouets."], ["avoir", "Elles", "ont", "🦋", "Elles ont des papillons."]];
const screens=[];
/* ?verbe=etre or ?verbe=avoir keeps only that verb (one tab per verb on the step 8 page). */const choixVerbe={etre:'être',avoir:'avoir'}[new URLSearchParams(location.search).get('verbe')];pronouns.forEach((p,i)=>{if(choixVerbe&&p[0]!==choixVerbe)return;screens.push({kind:'lesson',p,i});/* 3 questions per pronoun; the endings rotate so that all six still appear across the pronouns. */for(let n=0;n<3;n++)screens.push({kind:'question',p,i,q:(i*3+n)%6,n});if(i===7||i===15)screens.push({kind:'recap',verb:p[0]})});
if(choixVerbe&&window.self===window.top){const v=choixVerbe==='être'?'etre':'avoir';document.getElementById('retourLili').href='etape8.html#'+v;document.getElementById('versQuestions').href='etape8-'+v+'.html'}if(choixVerbe)document.getElementById('titreLili').textContent='🌈 La classe de Lili · '+(choixVerbe==='être'?'😊 ÊTRE':'🎒 AVOIR');let current=0;const answered={};const $=x=>document.getElementById(x);
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function show(){const s=screens[current],panel=$('panel');panel.replaceChildren();panel.className='panel'+((s.verb==='avoir'||s.p?.[0]==='avoir')?' avoir':'');let say='';if(s.kind==='recap'){say='Bravo ! On révise !';panel.append(el('div','verb','⭐ Je retiens : '+s.verb.toUpperCase()));const grid=el('div','recap');pronouns.filter(p=>p[0]===s.verb).forEach(p=>grid.append(el('div','item',p[1]+' → '+p[2])));panel.append(grid);if(choixVerbe){const v=choixVerbe==='être'?'etre':'avoir';const suite=el('div','suite-lili');const q=el('a','gros','❓ Les questions de Lili →');q.href='etape8-'+v+'.html';suite.append(q);const o=el('a','gros autre',v==='etre'?'🎒 Le verbe AVOIR →':'🎲 Les jeux →');o.href=v==='etre'?'classe_lili_etre_avoir.html?verbe=avoir':'etape8.html#jeux';suite.append(o);const t=el('a','gros tout','⬅ Retour aux étapes');t.href='index.html';suite.append(t);panel.append(suite)}}else{const [verb,pr,form,emoji,sentence]=s.p;panel.append(el('div','mini',verb.toUpperCase()+' · '+(s.i%8+1)+'/8'));if(s.kind==='lesson'){say='Regarde ! '+pr+' → '+form;panel.append(el('div','verb','👀 Regarde !'));panel.append(el('div','rule',pr+' → '+form));panel.append(el('div','pic',emoji));panel.append(el('div','example',sentence))}else{say='Choisis le bon mot !';panel.append(el('div','mini','Question '+(s.n+1)+' / 3'));/* Conjugation of the verb, shown above every question as a reminder. */const tab=verb==='être'?[['je','suis'],['tu','es'],['il / elle','est'],['nous','sommes'],['vous','êtes'],['ils / elles','sont']]:[['j’','ai'],['tu','as'],['il / elle','a'],['nous','avons'],['vous','avez'],['ils / elles','ont']];const conj=el('div','conj');conj.append(el('div','conj-titre','📘 '+verb.toUpperCase()+' au présent'));const g=el('div','conj-grille');tab.forEach(([a,b])=>{const c=el('span','');c.append(document.createTextNode(a+' '));c.append(el('b','',b));g.append(c)});conj.append(g);panel.append(conj);const nouns=verb==='être'?['à l’école','à la maison','dans le jardin','ici','en classe','au parc']:['un livre','un ballon','une pomme','un crayon','un sac','des jouets'];const prefix=pr==='J’'?'J’':pr+' ';const suffix=nouns[s.q];{const qd=el('div','question');qd.dataset.dire=prefix+'___ '+suffix+'.';qd.append(document.createTextNode(prefix));const cs=el('span','case');cs.setAttribute('aria-label','mot manquant');qd.append(cs,document.createTextNode(' '+suffix+'.'));panel.append(qd)}/* Wrong choice: the other verb with the same pronoun, or a word that sounds the same (et, son, à, on). */const wrongForms=verb==='être'?['ai','as','et','et','avons','avez','son','son']:['suis','es','à','à','sommes','êtes','on','on'];const AUTRES={"suis": ["ai", "es", "est", "sommes"], "es": ["as", "est", "suis", "et"], "est": ["a", "et", "es", "sont"], "sommes": ["avons", "êtes", "sont"], "êtes": ["avez", "sommes", "est"], "sont": ["ont", "son", "est", "sommes"], "ai": ["suis", "as", "a"], "as": ["es", "a", "ai", "est"], "a": ["est", "à", "as", "ont"], "avons": ["sommes", "avez", "ont"], "avez": ["êtes", "avons", "ont"], "ont": ["sont", "on", "a", "avons"], "et": ["est", "es", "ai"], "à": ["a", "as", "ont"], "son": ["sont", "ont", "on"], "on": ["ont", "sont", "son"]};const others=AUTRES[form].slice(0,3);const bad=others.find(w=>['et','son','à','on'].includes(w))||others[0];const opts=el('div','options');const tourne=(s.i*6+s.q)%4;const words=[form,...others];for(let r=0;r<tourne;r++)words.push(words.shift());words.forEach(word=>{const btn=el('button','',word);btn.onclick=()=>{if(answered[current])return;answered[current]=word===form?'correct':'wrong';Array.from(opts.children).forEach(b=>{b.disabled=true;{const cl=b.textContent===form?'correct':b===btn?'wrong':'';if(cl)b.classList.add(cl)}});$('feedback').textContent=word===form?'🌟 Bravo !':'💡 '+pr+' → '+form+(['et','son','à','on'].includes(word)?' : « '+word+' » se dit pareil, mais ce n’est pas le verbe.':'')};opts.append(btn)});panel.append(opts);const feedback=el('div','feedback','');feedback.id='feedback';panel.append(feedback);if(answered[current]){const cs0=panel.querySelector('.case');if(cs0){cs0.textContent=form;cs0.classList.add('pleine')}Array.from(opts.children).forEach(b=>{b.disabled=true;if(b.textContent===form)b.classList.add('correct')});feedback.textContent=answered[current]==='correct'?'🌟 Bravo !':'💡 Essaie de retenir : '+pr+' → '+form}}}$('say').textContent=say;$('counter').textContent=(current+1)+' / '+screens.length;$('back').disabled=current===0;$('next').disabled=current===screens.length-1}
$('back').onclick=()=>{if(current>0){current--;show()}};$('next').onclick=()=>{if(current<screens.length-1){current++;show()}};show();
</script><script src="voix.js"></script><script src="menu8.js"></script><script>/* Reads the screen: lesson, question and choices, or the summary. */document.getElementById("ecoute").onclick=()=>{const p=document.getElementById("panel");const q=p.querySelector(".question");const t=q?(q.dataset.dire||q.textContent)+" Choisis : "+[...p.querySelectorAll(".options button")].map(b=>b.textContent).join(", ")+".":[...p.querySelectorAll(".rule,.example,.verb,.item")].map(e=>e.textContent.replace("→"," ")).join(". ");LIRE(t,true)};document.getElementById("panel").addEventListener("click",e=>{const b=e.target.closest(".options button");if(!b)return;const q=document.getElementById("panel").querySelector(".question");const bon=document.getElementById("panel").querySelector(".options button.correct");if(q&&bon){GLISSER(bon,q.querySelector(".case"),bon.textContent);setTimeout(()=>LIRE((q.dataset.dire||"").replace("___",bon.textContent).replace("’ ","’")),60)}});</script></body></html>
